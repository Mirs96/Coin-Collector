{% extends "base.html" %}
{% block title %}
    Home - Coin Collector
{% endblock %}

{% block content %}
    <div class="game-container">
        <h1>Welcome, {{ current_user.username }}!</h1>
        
        <div class="game-controls">
            <form action="{{ url_for('start_game') }}" method="POST" id="startGameForm">
                <button type="submit" class="btn primary">Start Game</button>
            </form>
            
            <form action="{{ url_for('close_game') }}" method="POST" id="closeGameForm">
                <button type="submit" class="btn danger">Close Game</button>
            </form>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>
{% endblock %}
